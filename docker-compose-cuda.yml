services:
  ezlocalai:
    container_name: ezlocalai
    image: ${EZLOCALAI_CUDA_IMAGE:-ezlocalai:cuda}
    platform: linux/amd64
    build:
      context: .
      dockerfile: cuda.Dockerfile
      args:
        EZLOCALAI_CUDA_FLEET_PROFILE: ${EZLOCALAI_CUDA_FLEET_PROFILE-cuda}
        EZLOCALAI_NATIVE_JOBS: ${EZLOCALAI_NATIVE_JOBS:-}
        CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:12.8.1-devel-ubuntu24.04}
        EZLOCALAI_LLAMA_CPP_REPO: ${EZLOCALAI_LLAMA_CPP_REPO:-https://github.com/ggml-org/llama.cpp.git}
        EZLOCALAI_LLAMA_CPP_REF: ${EZLOCALAI_LLAMA_CPP_REF:-8642541b255bfb5dc39cd351a178be09013a55d6}
        EZLOCALAI_LLAMA_CPP_CMAKE_ARGS: ${EZLOCALAI_LLAMA_CPP_CMAKE_ARGS:--DGGML_CUDA=ON -DGGML_CUDA_NCCL=OFF -DLLAMA_CURL=ON -DGGML_NATIVE=OFF -DCMAKE_CUDA_ARCHITECTURES=86-real;89-real;120-real -DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath-link,/usr/local/cuda/lib64/stubs}
        EZLOCALAI_LLAMA_CPP_JOBS: ${EZLOCALAI_LLAMA_CPP_JOBS:-}
        EZLOCALAI_SDCPP_REF: ${EZLOCALAI_SDCPP_REF:-c678dfe704a2230342376b46add9c8ca736a653d}
        EZLOCALAI_ACESTEP_REF: ${EZLOCALAI_ACESTEP_REF:-5b88ded7919285d5ad5b1e86ffe3378314f305db}
        EZLOCALAI_MEDIA_CUDA_ARCHITECTURES: ${EZLOCALAI_MEDIA_CUDA_ARCHITECTURES:-86-real;89-real;120-real}
        # Portable CPU code for every fleet host, not the build host.
        EZLOCALAI_MEDIA_CMAKE_ARGS: ${EZLOCALAI_MEDIA_CMAKE_ARGS:--DGGML_NATIVE=OFF}
    env_file:
      - path: ${EZLOCALAI_ENV_FILE:-.env}
        required: false
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8091}
      EZLOCALAI_URL: "${EZLOCALAI_URL:-http://localhost:8091}"
      EZLOCALAI_API_KEY: "${EZLOCALAI_API_KEY:-}"
      EZLOCALAI_NATIVE_BACKEND: ${EZLOCALAI_NATIVE_BACKEND:-llama.cpp}

      DEFAULT_MODEL: "${DEFAULT_MODEL:-unsloth/Qwen3.5-4B-GGUF}"
      QUANT_TYPE: "${QUANT_TYPE:-Q3_K_XL}"
      WHISPER_MODEL: "${WHISPER_MODEL:-large-v3-turbo}"
      WHISPER_CPP_BIN: ${WHISPER_CPP_BIN:-}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-}
      WHISPER_CPP_MODEL_PATH: ${WHISPER_CPP_MODEL_PATH:-}
      WHISPER_CPP_MODEL_DIR: ${WHISPER_CPP_MODEL_DIR:-/app/whispercpp/models}
      WHISPER_CPP_EXTRA_ARGS: ${WHISPER_CPP_EXTRA_ARGS:-}
      WHISPER_CPP_TIMEOUT: ${WHISPER_CPP_TIMEOUT:-600}
      PDFTOTEXT_BIN: ${PDFTOTEXT_BIN:-/usr/bin/pdftotext}
      PDFTOTEXT_TIMEOUT: ${PDFTOTEXT_TIMEOUT:-60}
      IMAGE_ENABLED: "${IMAGE_ENABLED:-false}"
      IMG_MODEL: "${IMG_MODEL:-}"
      VIDEO_ENABLED: "${VIDEO_ENABLED:-false}"
      VIDEO_MODEL: "${VIDEO_MODEL:-QuantStack/Wan2.2-T2V-A14B-GGUF}"
      MUSIC_ENABLED: "${MUSIC_ENABLED:-false}"
      MUSIC_MODEL: "${MUSIC_MODEL:-Serveurperso/ACE-Step-1.5-GGUF}"

      MODELS_PATH: ${MODELS_PATH:-/app/models}
      HF_HOME: "/app/models"
      HF_HUB_CACHE: "/app/models"
      LLAMA_CACHE: ${LLAMA_CACHE:-/app/models/.llama.cpp}
      LLAMA_CPP_SERVER_BIN: ${LLAMA_CPP_SERVER_BIN:-/usr/local/bin/llama-server}
      LLAMA_CPP_SERVER_PORT: ${LLAMA_CPP_SERVER_PORT:-8092}
      LLAMA_CPP_MODEL_PATH: ${LLAMA_CPP_MODEL_PATH:-}
      LLAMA_CPP_MODEL_PATHS: ${LLAMA_CPP_MODEL_PATHS:-}
      LLAMA_CPP_CONTEXT: ${LLAMA_CPP_CONTEXT:-}
      LLAMA_CPP_DEFAULT_CONTEXT: ${LLAMA_CPP_DEFAULT_CONTEXT:-}
      LLAMA_CPP_MMPROJ_PATH: ${LLAMA_CPP_MMPROJ_PATH:-}
      LLAMA_CPP_EXTRA_ARGS: ${LLAMA_CPP_EXTRA_ARGS:-}
      LLAMA_CPP_FLASH_ATTENTION: ${LLAMA_CPP_FLASH_ATTENTION:-true}
      LLAMA_CPP_START_TIMEOUT: ${LLAMA_CPP_START_TIMEOUT:-3600}
      LLAMA_CPP_EMBEDDING_MODEL: ${LLAMA_CPP_EMBEDDING_MODEL:-}
      LLAMA_CPP_EMBEDDING_MODEL_PATH: ${LLAMA_CPP_EMBEDDING_MODEL_PATH:-}
      LLAMA_CPP_EMBEDDING_ALIAS: ${LLAMA_CPP_EMBEDDING_ALIAS:-}
      LLAMA_CPP_EMBEDDING_CONTEXT: ${LLAMA_CPP_EMBEDDING_CONTEXT:-}
      LLAMA_CPP_EMBEDDING_POOLING: ${LLAMA_CPP_EMBEDDING_POOLING:-}
      LLAMA_CPP_EMBEDDING_UBATCH: ${LLAMA_CPP_EMBEDDING_UBATCH:-}
      LLAMA_CPP_EMBEDDING_EXTRA_ARGS: ${LLAMA_CPP_EMBEDDING_EXTRA_ARGS:-}
      LLAMA_CPP_EMBEDDING_SERVER_PORT: ${LLAMA_CPP_EMBEDDING_SERVER_PORT:-}
      EZLOCALAI_MODEL_STATUS_ON_START: ${EZLOCALAI_MODEL_STATUS_ON_START:-true}
      EZLOCALAI_PRELOAD_MODEL_ON_START: ${EZLOCALAI_PRELOAD_MODEL_ON_START:-true}

      MAIN_GPU: "${MAIN_GPU:-0}"
      TENSOR_SPLIT: "${TENSOR_SPLIT:-}"
      GPU_LAYERS: ${GPU_LAYERS:-}
      LLM_BATCH_SIZE: "${LLM_BATCH_SIZE:-auto}"
      LLM_UBATCH_SIZE: "${LLM_UBATCH_SIZE:-auto}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-65536}"
      KV_CACHE_TYPE: "${KV_CACHE_TYPE:-auto}"
      N_PARALLEL: "${N_PARALLEL:-1}"
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS-}
      MAX_QUEUE_SIZE: "${MAX_QUEUE_SIZE:-100}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-120}"

      TTS_ENABLED: "${TTS_ENABLED:-true}"
      STT_ENABLED: "${STT_ENABLED:-true}"
      TTS_N_PARALLEL: "${TTS_N_PARALLEL:-1}"
      STT_N_PARALLEL: "${STT_N_PARALLEL:-1}"
      QWEN_TTS_MODEL: "${QWEN_TTS_MODEL:-Mouserat/qwen3-tts-0.6b-base-gguf}"
      EMBEDDING_ENABLED: "${EMBEDDING_ENABLED:-true}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B-GGUF}"
      EMBEDDING_MODEL_ALIAS: "${EMBEDDING_MODEL_ALIAS:-Qwen3-Embedding-0.6B}"
      EMBEDDING_QUANT_TYPE: "${EMBEDDING_QUANT_TYPE:-Q8_0}"
      EMBEDDING_CONTEXT_LENGTH: "${EMBEDDING_CONTEXT_LENGTH:-10000}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-512}"
      EMBEDDING_UBATCH_SIZE: "${EMBEDDING_UBATCH_SIZE:-512}"
      EMBEDDING_KV_CACHE_TYPE: "${EMBEDDING_KV_CACHE_TYPE:-f16}"
      EMBEDDING_GPU_LAYERS: "${EMBEDDING_GPU_LAYERS:-auto}"
      EMBEDDING_MAIN_GPU: ${EMBEDDING_MAIN_GPU:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_N_PARALLEL: "${EMBEDDING_N_PARALLEL:-1}"
      EMBEDDING_SERVER: "${EMBEDDING_SERVER:-}"
      EMBEDDING_SERVER_API_KEY: "${EMBEDDING_SERVER_API_KEY:-}"
      TTS_PROVIDER: "${TTS_PROVIDER:-qwen}"
      VOICE_SERVER: "${VOICE_SERVER:-}"
      VOICE_SERVER_API_KEY: "${VOICE_SERVER_API_KEY:-}"
      IMAGE_SERVER: "${IMAGE_SERVER:-}"
      IMAGE_SERVER_API_KEY: "${IMAGE_SERVER_API_KEY:-}"
      TEXT_SERVER: "${TEXT_SERVER:-}"
      TEXT_SERVER_API_KEY: "${TEXT_SERVER_API_KEY:-}"
      FALLBACK_SERVER: ${FALLBACK_SERVER:-}
      FALLBACK_API_KEY: ${FALLBACK_API_KEY:-}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-}
      LAZY_LOAD_VOICE: "${LAZY_LOAD_VOICE:-false}"

      ROUTER_URL: "${ROUTER_URL:-}"
      ROUTER_API_KEY: "${ROUTER_API_KEY:-}"
      WORKER_LABEL: "${WORKER_LABEL:-}"
      WORKER_HEARTBEAT_INTERVAL: "${WORKER_HEARTBEAT_INTERVAL:-10}"
      WORKER_TUNNEL: ${WORKER_TUNNEL:-}

      CUDA_DOCKER_ARCH: "all"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      # Python CUDA profile defaults and host-environment overrides.
      IMAGE_UNLOAD_LLM_DURING_GENERATION: "${IMAGE_UNLOAD_LLM_DURING_GENERATION:-auto}"
      IMAGE_RELOAD_LLM_AFTER_GENERATION: "${IMAGE_RELOAD_LLM_AFTER_GENERATION:-true}"
      IMAGE_WAIT_FOR_LLM_IDLE_TIMEOUT: "${IMAGE_WAIT_FOR_LLM_IDLE_TIMEOUT:-60}"
      IMAGE_MODEL_MIN_FREE_GB: "${IMAGE_MODEL_MIN_FREE_GB:-6}"
      VIDEO_QUANT_TYPE: "${VIDEO_QUANT_TYPE:-Q4_K_M}"
      VIDEO_GENERATION_TIMEOUT: "${VIDEO_GENERATION_TIMEOUT:-3600}"
      VIDEO_UNLOAD_LLM_DURING_GENERATION: "${VIDEO_UNLOAD_LLM_DURING_GENERATION:-auto}"
      VIDEO_RELOAD_LLM_AFTER_GENERATION: "${VIDEO_RELOAD_LLM_AFTER_GENERATION:-true}"
      VIDEO_WAIT_FOR_LLM_IDLE_TIMEOUT: "${VIDEO_WAIT_FOR_LLM_IDLE_TIMEOUT:-60}"
      VIDEO_GPU_RESIDENCY: "${VIDEO_GPU_RESIDENCY:-auto}"
      VIDEO_MODEL_OFFLOAD_MIN_FREE_GB: "${VIDEO_MODEL_OFFLOAD_MIN_FREE_GB:-16}"
      VIDEO_FULL_GPU_MIN_FREE_GB: "${VIDEO_FULL_GPU_MIN_FREE_GB:-30}"
      VIDEO_SHORT_MODEL_OFFLOAD_MIN_FREE_GB: "${VIDEO_SHORT_MODEL_OFFLOAD_MIN_FREE_GB:-12}"
      VIDEO_MODEL_OFFLOAD_MAX_FRAMES: "${VIDEO_MODEL_OFFLOAD_MAX_FRAMES:-129}"
      VIDEO_MODEL_OFFLOAD_MAX_PIXELS: "${VIDEO_MODEL_OFFLOAD_MAX_PIXELS:-262144}"
      VIDEO_RETRY_SEQUENTIAL_ON_OOM: "${VIDEO_RETRY_SEQUENTIAL_ON_OOM:-true}"
      VIDEO_CONNECTORS_SOURCE: "${VIDEO_CONNECTORS_SOURCE:-diffusers}"
      MUSIC_VIDEO_SCENE_DURATION: "${MUSIC_VIDEO_SCENE_DURATION:-5}"
      MUSIC_VIDEO_MAX_SCENE_DURATION: "${MUSIC_VIDEO_MAX_SCENE_DURATION:-20}"
      ACE_STEP_SERVER_URL: "${ACE_STEP_SERVER_URL:-}"
      ACE_STEP_AUTO_START: "${ACE_STEP_AUTO_START:-true}"
      ACE_STEP_HOST: "${ACE_STEP_HOST:-127.0.0.1}"
      ACE_STEP_PORT: "${ACE_STEP_PORT:-8085}"
      ACE_STEP_MODELS_DIR: "${ACE_STEP_MODELS_DIR:-models/ace-step}"
      ACE_STEP_MODEL_REPO: "${ACE_STEP_MODEL_REPO:-Serveurperso/ACE-Step-1.5-GGUF}"
      ACE_STEP_TEXT_ENCODER_MODEL: "${ACE_STEP_TEXT_ENCODER_MODEL:-Qwen3-Embedding-0.6B-Q8_0.gguf}"
      ACE_STEP_LM_MODEL: "${ACE_STEP_LM_MODEL:-acestep-5Hz-lm-4B-Q8_0.gguf}"
      ACE_STEP_DIT_MODEL: "${ACE_STEP_DIT_MODEL:-acestep-v15-turbo-Q4_K_M.gguf}"
      ACE_STEP_VAE_MODEL: "${ACE_STEP_VAE_MODEL:-vae-BF16.gguf}"
      ACE_STEP_PRECACHE: "${ACE_STEP_PRECACHE:-true}"
      ACE_STEP_TIMEOUT: "${ACE_STEP_TIMEOUT:-1800}"
      ACE_STEP_POLL_INTERVAL: "${ACE_STEP_POLL_INTERVAL:-1.0}"
      ACE_STEP_STARTUP_TIMEOUT: "${ACE_STEP_STARTUP_TIMEOUT:-30}"
      MUSIC_UNLOAD_LLM_DURING_GENERATION: "${MUSIC_UNLOAD_LLM_DURING_GENERATION:-auto}"
      MUSIC_RELOAD_LLM_AFTER_GENERATION: "${MUSIC_RELOAD_LLM_AFTER_GENERATION:-true}"
      MUSIC_WAIT_FOR_LLM_IDLE_TIMEOUT: "${MUSIC_WAIT_FOR_LLM_IDLE_TIMEOUT:-60}"
      LLM_MODEL_RESIDENCY: "${LLM_MODEL_RESIDENCY:-auto}"
      LLM_MODEL_RESIDENCY_MARGIN_GB: "${LLM_MODEL_RESIDENCY_MARGIN_GB:-1.5}"
      LLM_PROMPT_CACHE_MIB: "${LLM_PROMPT_CACHE_MIB:-auto}"
      LLM_PROMPT_CACHE_SWAP_MIB: "${LLM_PROMPT_CACHE_SWAP_MIB:-0}"
      LLM_PROMPT_CACHE_SWAP_MARGIN_MIB: "${LLM_PROMPT_CACHE_SWAP_MARGIN_MIB:-1024}"
      LLM_PROMPT_CACHE_RAM_MARGIN_MIB: "${LLM_PROMPT_CACHE_RAM_MARGIN_MIB:-4096}"
      LLM_PROMPT_CACHE_MAX_RAM_FRACTION: "${LLM_PROMPT_CACHE_MAX_RAM_FRACTION:-0.25}"
      LLM_PROMPT_CACHE_ALLOW_UNSAFE: "${LLM_PROMPT_CACHE_ALLOW_UNSAFE:-false}"
      LLM_MAX_OUTPUT_TOKENS: "${LLM_MAX_OUTPUT_TOKENS:-16384}"
      MTP_SPEC_DRAFT_P_MIN: "${MTP_SPEC_DRAFT_P_MIN:-auto}"
      MTP_SPEC_DRAFT_N_MAX: "${MTP_SPEC_DRAFT_N_MAX:-auto}"
      MTP_SPEC_DRAFT_N_MAX_3090: "${MTP_SPEC_DRAFT_N_MAX_3090:-}"
      MTP_SPEC_DRAFT_N_MAX_4090: "${MTP_SPEC_DRAFT_N_MAX_4090:-}"
      MTP_SPEC_DRAFT_N_MAX_5090: "${MTP_SPEC_DRAFT_N_MAX_5090:-}"
      MTP_SPEC_DRAFT_N_MAX_T4: "${MTP_SPEC_DRAFT_N_MAX_T4:-}"
      MTP_SPEC_DRAFT_N_MAX_A100: "${MTP_SPEC_DRAFT_N_MAX_A100:-}"
      MTP_SPEC_DRAFT_N_MAX_H100: "${MTP_SPEC_DRAFT_N_MAX_H100:-}"
      LLM_SPECULATIVE_TYPE: "${LLM_SPECULATIVE_TYPE:-auto}"
      DFLASH_SPEC_DRAFT_N_MAX: "${DFLASH_SPEC_DRAFT_N_MAX:-auto}"
      KV_CACHE_TYPE_3090: "${KV_CACHE_TYPE_3090:-}"
      KV_CACHE_TYPE_4090: "${KV_CACHE_TYPE_4090:-}"
      KV_CACHE_TYPE_5090: "${KV_CACHE_TYPE_5090:-}"
      KV_CACHE_TYPE_T4: "${KV_CACHE_TYPE_T4:-}"
      KV_CACHE_TYPE_A100: "${KV_CACHE_TYPE_A100:-}"
      KV_CACHE_TYPE_H100: "${KV_CACHE_TYPE_H100:-}"
      DFLASH_SPEC_DRAFT_N_MAX_3090: "${DFLASH_SPEC_DRAFT_N_MAX_3090:-}"
      DFLASH_SPEC_DRAFT_N_MAX_4090: "${DFLASH_SPEC_DRAFT_N_MAX_4090:-}"
      DFLASH_SPEC_DRAFT_N_MAX_5090: "${DFLASH_SPEC_DRAFT_N_MAX_5090:-}"
      DFLASH_SPEC_DRAFT_N_MAX_T4: "${DFLASH_SPEC_DRAFT_N_MAX_T4:-}"
      DFLASH_SPEC_DRAFT_N_MAX_A100: "${DFLASH_SPEC_DRAFT_N_MAX_A100:-}"
      DFLASH_SPEC_DRAFT_N_MAX_H100: "${DFLASH_SPEC_DRAFT_N_MAX_H100:-}"
      DFLASH_SPEC_DRAFT_P_MIN: "${DFLASH_SPEC_DRAFT_P_MIN:-0.0}"
      DFLASH_MODEL_FILE: "${DFLASH_MODEL_FILE:-Qwen3.8-27B-DFlash2-Q4_K_M.gguf}"
      DFLASH_MODEL_PATH: "${DFLASH_MODEL_PATH:-}"
      GGML_CUDA_GRAPH_OPT: "${GGML_CUDA_GRAPH_OPT:-0}"
      TOKENIZERS_PARALLELISM: "false"
      EMBEDDING_VRAM_SAFETY_MARGIN: "${EMBEDDING_VRAM_SAFETY_MARGIN:-0.75}"
      EMBEDDING_KEEP_LOADED: "${EMBEDDING_KEEP_LOADED:-true}"
      VOICE_UNLOAD_LLM_DURING_GENERATION: "${VOICE_UNLOAD_LLM_DURING_GENERATION:-auto}"
      VOICE_RELOAD_LLM_AFTER_GENERATION: "${VOICE_RELOAD_LLM_AFTER_GENERATION:-false}"
      VOICE_WAIT_FOR_LLM_IDLE_TIMEOUT: "${VOICE_WAIT_FOR_LLM_IDLE_TIMEOUT:-60}"
      QWEN_TTS_CONTEXT_SIZE: "${QWEN_TTS_CONTEXT_SIZE:-4096}"
      QWEN_TTS_THREADS: "${QWEN_TTS_THREADS:-20}"
      QWEN_TTS_TIMEOUT: "${QWEN_TTS_TIMEOUT:-300}"
      QWEN_TTS_ALLOW_CPU_FALLBACK: "${QWEN_TTS_ALLOW_CPU_FALLBACK:-true}"
      QWEN_TTS_ENABLE_GTTS_FALLBACK: "${QWEN_TTS_ENABLE_GTTS_FALLBACK:-true}"
      QWEN_TTS_MAX_NEW_TOKENS: "${QWEN_TTS_MAX_NEW_TOKENS:-320}"
      QWEN_TTS_MAX_CHUNK_CHARS: "${QWEN_TTS_MAX_CHUNK_CHARS:-350}"
      QWEN_TTS_STREAM_CHUNK_CHARS: "${QWEN_TTS_STREAM_CHUNK_CHARS:-280}"
      QWEN_TTS_STREAM_FIRST_CHUNK_CHARS: "${QWEN_TTS_STREAM_FIRST_CHUNK_CHARS:-120}"
      QWEN_TTS_STREAM_MIN_FIRST_CHUNK_CHARS: "${QWEN_TTS_STREAM_MIN_FIRST_CHUNK_CHARS:-50}"
      QWEN_TTS_STREAM_WRITE_BYTES: "${QWEN_TTS_STREAM_WRITE_BYTES:-16384}"
      QWEN_TTS_STREAM_FRAME_DRAIN_SECONDS: "${QWEN_TTS_STREAM_FRAME_DRAIN_SECONDS:-0}"
      QWEN_TTS_STREAM_FLUSH_SILENCE_MS: "${QWEN_TTS_STREAM_FLUSH_SILENCE_MS:-0}"
      QWEN_TTS_MIN_VRAM_MB: "${QWEN_TTS_MIN_VRAM_MB:-3500}"
      ROUTER_CLIENT_API_KEY: "${ROUTER_CLIENT_API_KEY:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf \"http://localhost:${PORT:-8091}/health\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "5"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${EZLOCALAI_HOST_PORT:-8091}:${PORT:-8091}"
    volumes:
      - ${EZLOCALAI_MODELS_DIR:-./models}:/app/models
      - ${EZLOCALAI_OUTPUTS_DIR:-./outputs}:/app/outputs
      - ${EZLOCALAI_VOICES_DIR:-./voices}:/app/voices
      - ${EZLOCALAI_WHISPERCPP_DIR:-./whispercpp}:/app/whispercpp
      - ${EZLOCALAI_WAKEWORD_MODELS_DIR:-./wakeword_models}:/app/wakeword_models
      - ${EZLOCALAI_WAKEWORD_SAMPLES_DIR:-./wakeword_samples}:/app/wakeword_samples
      - ${EZLOCALAI_WAKEWORD_JOBS_DIR:-./wakeword_jobs}:/app/wakeword_jobs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
