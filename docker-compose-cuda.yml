services:
  ezlocalai:
    container_name: ezlocalai
    build:
      context: .
      dockerfile: cuda.Dockerfile
    env_file:
      - .env
    environment:
      - EZLOCALAI_URL=${EZLOCALAI_URL:-http://localhost:8091}
      - EZLOCALAI_API_KEY=${EZLOCALAI_API_KEY:-}
      - MAIN_GPU=${MAIN_GPU:-0}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-unsloth/Qwen3.5-4B-GGUF}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
      - IMAGE_ENABLED=${IMAGE_ENABLED:-false}
      - IMG_MODEL=${IMG_MODEL:-}
      - IMAGE_UNLOAD_LLM_DURING_GENERATION=${IMAGE_UNLOAD_LLM_DURING_GENERATION:-auto}
      - IMAGE_RELOAD_LLM_AFTER_GENERATION=${IMAGE_RELOAD_LLM_AFTER_GENERATION:-true}
      - IMAGE_WAIT_FOR_LLM_IDLE_TIMEOUT=${IMAGE_WAIT_FOR_LLM_IDLE_TIMEOUT:-60}
      - IMAGE_MODEL_MIN_FREE_GB=${IMAGE_MODEL_MIN_FREE_GB:-6}
      - VIDEO_ENABLED=${VIDEO_ENABLED:-false}
      - VIDEO_MODEL=${VIDEO_MODEL:-unsloth/LTX-2.3-GGUF}
      - VIDEO_UNLOAD_LLM_DURING_GENERATION=${VIDEO_UNLOAD_LLM_DURING_GENERATION:-auto}
      - VIDEO_RELOAD_LLM_AFTER_GENERATION=${VIDEO_RELOAD_LLM_AFTER_GENERATION:-true}
      - VIDEO_WAIT_FOR_LLM_IDLE_TIMEOUT=${VIDEO_WAIT_FOR_LLM_IDLE_TIMEOUT:-60}
      - VIDEO_GPU_RESIDENCY=${VIDEO_GPU_RESIDENCY:-auto}
      - VIDEO_MODEL_OFFLOAD_MIN_FREE_GB=${VIDEO_MODEL_OFFLOAD_MIN_FREE_GB:-16}
      - VIDEO_FULL_GPU_MIN_FREE_GB=${VIDEO_FULL_GPU_MIN_FREE_GB:-30}
      - VIDEO_SHORT_MODEL_OFFLOAD_MIN_FREE_GB=${VIDEO_SHORT_MODEL_OFFLOAD_MIN_FREE_GB:-12}
      - VIDEO_MODEL_OFFLOAD_MAX_FRAMES=${VIDEO_MODEL_OFFLOAD_MAX_FRAMES:-129}
      - VIDEO_MODEL_OFFLOAD_MAX_PIXELS=${VIDEO_MODEL_OFFLOAD_MAX_PIXELS:-262144}
      - VIDEO_RETRY_SEQUENTIAL_ON_OOM=${VIDEO_RETRY_SEQUENTIAL_ON_OOM:-true}
      - VIDEO_CONNECTORS_SOURCE=${VIDEO_CONNECTORS_SOURCE:-diffusers}
      - MUSIC_VIDEO_SCENE_DURATION=${MUSIC_VIDEO_SCENE_DURATION:-5}
      - MUSIC_VIDEO_MAX_SCENE_DURATION=${MUSIC_VIDEO_MAX_SCENE_DURATION:-20}
      - MUSIC_ENABLED=${MUSIC_ENABLED:-false}
      - MUSIC_MODEL=${MUSIC_MODEL:-Serveurperso/ACE-Step-1.5-GGUF}
      - ACE_STEP_SERVER_URL=${ACE_STEP_SERVER_URL:-}
      - ACE_STEP_AUTO_START=${ACE_STEP_AUTO_START:-true}
      - ACE_STEP_HOST=${ACE_STEP_HOST:-127.0.0.1}
      - ACE_STEP_PORT=${ACE_STEP_PORT:-8085}
      - ACE_STEP_MODELS_DIR=${ACE_STEP_MODELS_DIR:-models/ace-step}
      - ACE_STEP_MODEL_REPO=${ACE_STEP_MODEL_REPO:-Serveurperso/ACE-Step-1.5-GGUF}
      - ACE_STEP_TEXT_ENCODER_MODEL=${ACE_STEP_TEXT_ENCODER_MODEL:-Qwen3-Embedding-0.6B-Q8_0.gguf}
      - ACE_STEP_LM_MODEL=${ACE_STEP_LM_MODEL:-acestep-5Hz-lm-4B-Q8_0.gguf}
      - ACE_STEP_DIT_MODEL=${ACE_STEP_DIT_MODEL:-acestep-v15-turbo-Q4_K_M.gguf}
      - ACE_STEP_VAE_MODEL=${ACE_STEP_VAE_MODEL:-vae-BF16.gguf}
      - ACE_STEP_PRECACHE=${ACE_STEP_PRECACHE:-true}
      - ACE_STEP_TIMEOUT=${ACE_STEP_TIMEOUT:-1800}
      - ACE_STEP_POLL_INTERVAL=${ACE_STEP_POLL_INTERVAL:-1.0}
      - ACE_STEP_STARTUP_TIMEOUT=${ACE_STEP_STARTUP_TIMEOUT:-30}
      - MUSIC_UNLOAD_LLM_DURING_GENERATION=${MUSIC_UNLOAD_LLM_DURING_GENERATION:-auto}
      - MUSIC_RELOAD_LLM_AFTER_GENERATION=${MUSIC_RELOAD_LLM_AFTER_GENERATION:-true}
      - MUSIC_WAIT_FOR_LLM_IDLE_TIMEOUT=${MUSIC_WAIT_FOR_LLM_IDLE_TIMEOUT:-60}
      - LLM_BATCH_SIZE=${LLM_BATCH_SIZE:-auto}
      - LLM_UBATCH_SIZE=${LLM_UBATCH_SIZE:-auto}
      - LLM_MODEL_RESIDENCY=${LLM_MODEL_RESIDENCY:-auto}
      - LLM_MODEL_RESIDENCY_MARGIN_GB=${LLM_MODEL_RESIDENCY_MARGIN_GB:-1.5}
      - LLM_PROMPT_CACHE_MIB=${LLM_PROMPT_CACHE_MIB:-auto}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-65536}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-16384}
      - N_PARALLEL=${N_PARALLEL:-1}
      - QUANT_TYPE=${QUANT_TYPE:-Q3_K_XL}
      - MTP_SPEC_DRAFT_P_MIN=${MTP_SPEC_DRAFT_P_MIN:-auto}
      - MTP_SPEC_DRAFT_N_MAX=${MTP_SPEC_DRAFT_N_MAX:-auto}
      # Experimental llama.cpp concurrent-stream optimization for single-GPU
      # token generation. Keep opt-in because the gain is GPU/model specific.
      - GGML_CUDA_GRAPH_OPT=${GGML_CUDA_GRAPH_OPT:-0}
      - CUDA_DOCKER_ARCH=all
      - TENSOR_SPLIT=${TENSOR_SPLIT:-}
      - TOKENIZERS_PARALLELISM=false
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-100}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-120}
      - VOICE_SERVER=${VOICE_SERVER:-}
      - VOICE_SERVER_API_KEY=${VOICE_SERVER_API_KEY:-}
      - TTS_ENABLED=${TTS_ENABLED:-true}
      - TTS_N_PARALLEL=${TTS_N_PARALLEL:-1}
      - STT_ENABLED=${STT_ENABLED:-true}
      - STT_N_PARALLEL=${STT_N_PARALLEL:-1}
      - IMAGE_SERVER=${IMAGE_SERVER:-}
      - IMAGE_SERVER_API_KEY=${IMAGE_SERVER_API_KEY:-}
      - TEXT_SERVER=${TEXT_SERVER:-}
      - TEXT_SERVER_API_KEY=${TEXT_SERVER_API_KEY:-}
      - EMBEDDING_ENABLED=${EMBEDDING_ENABLED:-true}
      - EMBEDDING_SERVER=${EMBEDDING_SERVER:-}
      - EMBEDDING_SERVER_API_KEY=${EMBEDDING_SERVER_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B-GGUF}
      - EMBEDDING_MODEL_ALIAS=${EMBEDDING_MODEL_ALIAS:-Qwen3-Embedding-0.6B}
      - EMBEDDING_QUANT_TYPE=${EMBEDDING_QUANT_TYPE:-Q8_0}
      - EMBEDDING_CONTEXT_LENGTH=${EMBEDDING_CONTEXT_LENGTH:-32768}
      - EMBEDDING_N_PARALLEL=${EMBEDDING_N_PARALLEL:-1}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-512}
      - EMBEDDING_UBATCH_SIZE=${EMBEDDING_UBATCH_SIZE:-512}
      - EMBEDDING_GPU_LAYERS=${EMBEDDING_GPU_LAYERS:-auto}
      - EMBEDDING_VRAM_SAFETY_MARGIN=${EMBEDDING_VRAM_SAFETY_MARGIN:-0.75}
      - EMBEDDING_KV_CACHE_TYPE=${EMBEDDING_KV_CACHE_TYPE:-f16}
      - EMBEDDING_KEEP_LOADED=${EMBEDDING_KEEP_LOADED:-true}
      - LAZY_LOAD_VOICE=${LAZY_LOAD_VOICE:-false}
      - VOICE_UNLOAD_LLM_DURING_GENERATION=${VOICE_UNLOAD_LLM_DURING_GENERATION:-auto}
      - VOICE_RELOAD_LLM_AFTER_GENERATION=${VOICE_RELOAD_LLM_AFTER_GENERATION:-false}
      - VOICE_WAIT_FOR_LLM_IDLE_TIMEOUT=${VOICE_WAIT_FOR_LLM_IDLE_TIMEOUT:-60}
      - TTS_PROVIDER=${TTS_PROVIDER:-qwen}
      - QWEN_TTS_MODEL=${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-Base}
      - QWEN_TTS_DTYPE=${QWEN_TTS_DTYPE:-auto}
      - QWEN_TTS_ATTENTION=${QWEN_TTS_ATTENTION:-sdpa}
      - QWEN_TTS_NON_STREAMING_MODE=${QWEN_TTS_NON_STREAMING_MODE:-true}
      - QWEN_TTS_X_VECTOR_ONLY=${QWEN_TTS_X_VECTOR_ONLY:-false}
      - QWEN_TTS_ALLOW_CPU_FALLBACK=${QWEN_TTS_ALLOW_CPU_FALLBACK:-true}
      - QWEN_TTS_ENABLE_GTTS_FALLBACK=${QWEN_TTS_ENABLE_GTTS_FALLBACK:-true}
      - QWEN_TTS_MAX_NEW_TOKENS=${QWEN_TTS_MAX_NEW_TOKENS:-320}
      - QWEN_TTS_MAX_CHUNK_CHARS=${QWEN_TTS_MAX_CHUNK_CHARS:-350}
      - QWEN_TTS_STREAM_CHUNK_CHARS=${QWEN_TTS_STREAM_CHUNK_CHARS:-280}
      - QWEN_TTS_STREAM_FIRST_CHUNK_CHARS=${QWEN_TTS_STREAM_FIRST_CHUNK_CHARS:-120}
      - QWEN_TTS_STREAM_MIN_FIRST_CHUNK_CHARS=${QWEN_TTS_STREAM_MIN_FIRST_CHUNK_CHARS:-50}
      - QWEN_TTS_STREAM_WRITE_BYTES=${QWEN_TTS_STREAM_WRITE_BYTES:-16384}
      - QWEN_TTS_STREAM_FRAME_DRAIN_SECONDS=${QWEN_TTS_STREAM_FRAME_DRAIN_SECONDS:-0.1}
      - QWEN_TTS_STREAM_FLUSH_SILENCE_MS=${QWEN_TTS_STREAM_FLUSH_SILENCE_MS:-80}
      - QWEN_TTS_MIN_VRAM_MB=${QWEN_TTS_MIN_VRAM_MB:-3500}
      # Consolidate all HF downloads into /app/models so we don't cache the
      # same repo twice (once under HF's default hub dir, once under the
      # explicit cache_dir="models" used by IMG/VIDEO GGUF downloads).
      - HF_HUB_CACHE=/app/models
      - HF_HOME=/app/models
      # Optional: register with a router/load balancer
      - ROUTER_URL=${ROUTER_URL:-}
      - ROUTER_API_KEY=${ROUTER_API_KEY:-}
      - ROUTER_CLIENT_API_KEY=${ROUTER_CLIENT_API_KEY:-}
      - WORKER_LABEL=${WORKER_LABEL:-}
      - WORKER_HEARTBEAT_INTERVAL=${WORKER_HEARTBEAT_INTERVAL:-10}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "5"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8091:8091"
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./voices:/app/voices
      - ./whispercpp:/app/whispercpp
      - ./CosyVoice:/app/CosyVoice
      - ./pretrained_models:/app/pretrained_models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
